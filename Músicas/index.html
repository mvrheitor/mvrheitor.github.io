<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lista de Músicas</title>
  <style>
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      background: linear-gradient(145deg, #1c1c1c, #2a2a2a);
      color: #f5f5f5;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      overflow: hidden;
    }

    .container {
      max-width: 800px;
      width: 90%;
      padding: 20px;
      backdrop-filter: blur(10px);
      background: rgba(255, 255, 255, 0.1);
      border-radius: 16px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
      color: #d1d1d1;
      overflow-y: auto;
      max-height: 90vh;
    }

    h1 {
      font-size: 2rem;
      font-weight: 600;
      text-align: center;
      color: #fff;
      margin-bottom: 1rem;
    }

    ul {
      list-style: none;
      padding: 0;
      margin: 0;
    }

    li {
      background: rgba(0, 0, 0, 0.4);
      border-radius: 8px;
      margin-bottom: 10px;
      padding: 15px;
      color: #fff;
      font-size: 1rem;
      line-height: 1.5;
      display: flex;
      align-items: center;
      box-shadow: 0 5px 15px rgba(0, 0, 0, 0.3);
    }

    li span {
      font-weight: bold;
      color: #007aff;
      margin-right: 10px;
    }

    .back-link {
      display: block;
      text-align: center;
      margin-top: 20px;
      text-decoration: none;
      color: #007aff;
      font-weight: 500;
      transition: color 0.3s ease;
    }

    .back-link:hover {
      color: #005bb5;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Lista de Músicas</h1>
    <ul id="musicas-lista">
      <li>Carregando músicas...</li>
    </ul>
    <a href="../index.html" class="back-link">← Voltar</a>
  </div>

  <script>
    // Carregamento das músicas e exibição na lista
    async function loadMusicas() {
      const response = await fetch('Musicas.txt'); // Caminho atualizado sem acento
      const content = await response.text();
      const lines = content.split('\n');
      const lista = document.getElementById('musicas-lista');
      lista.innerHTML = ''; // Limpa conteúdo anterior

      lines.forEach((line, index) => {
        if (line.trim()) { // Ignora linhas vazias
          const li = document.createElement('li');
          const [musica, artista] = line.split(' por '); // Divide no " por "
          li.innerHTML = `<span>${index + 1}.</span> <strong>${musica || 'Título Desconhecido'}</strong> — ${artista || 'Artista Desconhecido'}`;
          lista.appendChild(li);
        }
      });
    }

    // Carrega as músicas ao iniciar
    loadMusicas().catch(() => {
      const lista = document.getElementById('musicas-lista');
      lista.innerHTML = '<li>Erro ao carregar o arquivo Musicas.txt.</li>';
    });
  </script>
</body>
</html>
