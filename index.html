<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dark Minimalist Site</title>
  <style>
    /* Reset básico */
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      background: linear-gradient(145deg, #1c1c1c, #2a2a2a);
      color: #f5f5f5;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      overflow: hidden;
    }

    .container {
      text-align: center;
      max-width: 600px;
      padding: 20px;
      backdrop-filter: blur(10px);
      background: rgba(255, 255, 255, 0.1);
      border-radius: 16px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
    }

    h1 {
      font-size: 2rem;
      font-weight: 600;
      margin-bottom: 1rem;
      color: #fff;
    }

    p {
      font-size: 1rem;
      margin-bottom: 2rem;
      color: #d1d1d1;
    }

    .button-container {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .button {
      padding: 15px 20px;
      font-size: 1rem;
      color: #fff;
      background: rgba(0, 122, 255, 0.8);
      border: none;
      border-radius: 8px;
      cursor: pointer;
      text-align: center;
      text-decoration: none;
      transition: background 0.3s ease, transform 0.2s ease, box-shadow 0.3s ease;
      box-shadow: 0 5px 15px rgba(0, 122, 255, 0.4);
    }

    .button:hover {
      background: rgba(0, 122, 255, 1);
      transform: scale(1.05);
      box-shadow: 0 10px 25px rgba(0, 122, 255, 0.6);
    }

    .button:active {
      transform: scale(0.98);
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Bem-vindo!</h1>
    <p>Escolha uma opção abaixo:</p>
    <div class="button-container">
      <!-- O botão "Biblioteca" agora abre o index.html dentro da pasta Biblioteca -->
      <a href="Biblioteca/index.html" class="button">Biblioteca</a>
      <a href="Músicas/index.html" class="button">Backup de Músicas</a>
      <a href="Database.kdbx" class="button" download>Backup de Senhas</a>
    </div>
  </div>
</body>
</html>
